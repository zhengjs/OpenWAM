# @package _global_
# Experiment: QwenOFT chain (vla oftp variant) — action-token hidden states
# -> MLP L1 regression, no diffusion. Dataloader: raw-width RoboTwin actions.
#
# Launch:  bash scripts/train.sh +experiment=qwen_oft
# Create your own experiment by copying this file under configs/experiment/
# (every experiment config needs `# @package _global_` at the top).
defaults:
  - override /model: vla
  - override /dataloader: robot/robotwin_vla
  - _self_

model:
  architecture:
    variant: oftp                   # pairs with action_model_type: MLP (fail-fast at build)
    action_head:
      action_model_type: MLP

project:
  name: qwen_oft_robotwin
